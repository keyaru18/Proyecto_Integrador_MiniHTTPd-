<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiniHTTPd</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="tarjeta">
        <img src="image.png" alt="Logo de MiniHTTPd" width="128" height="128">
        <h1>MiniHTTPd</h1>
        <p>Servidor HTTP/1.1 minimo escrito en C, con <code>epoll</code>,
           conexiones persistentes y archivos estaticos.</p>
        <p class="ok">Si ves esta pagina con estilos e imagen, el servidor entrega
           correctamente <code>text/html</code>, <code>text/css</code> e
           <code>image/png</code>.</p>
    </main>
</body>
</html>
